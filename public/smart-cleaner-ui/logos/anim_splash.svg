<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 393 393"
     width="288"
     height="288">

    <style>
        :root {
            /* Matches Android overshoot_interpolator */
            --overshoot: cubic-bezier(0.34, 1.56, 0.64, 1);
            --total-duration: 3.4s;
        }

        /* 1. Main Broom Animation (800ms pop, overshoot) */
        .broom-anim {
            animation: broom-pop var(--total-duration) infinite;
            transform-origin: 0px 0px;
        }

        @keyframes broom-pop {
            0% {
                opacity: 0;
                transform: rotate(-90deg) scale(0);
                animation-timing-function: var(--overshoot);
            }
            5.88% { /* 200ms alpha */
                opacity: 1;
            }
            23.53% { /* 800ms overshoot ends */
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
            80% { /* Rest period */
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
            86% { /* Fade out before loop */
                opacity: 0;
                transform: rotate(0deg) scale(0.9);
            }
            100% {
                opacity: 0;
                transform: rotate(-90deg) scale(0);
            }
        }

        /* 2. Blue Star Animation (starts at 500ms, 300ms duration) */
        .star-blue-anim {
            animation: star-blue-pop var(--total-duration) infinite;
            transform-origin: 0px 0px;
        }

        @keyframes star-blue-pop {
            0%, 14.71% { /* 0 to 500ms delay */
                opacity: 0;
                transform: rotate(-90deg) scale(0);
                animation-timing-function: var(--overshoot);
            }
            17.65% { /* +100ms alpha */
                opacity: 1;
            }
            23.53% { /* 800ms: reaches full scale */
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
            80% {
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
            86% {
                opacity: 0;
                transform: rotate(0deg) scale(0.9);
            }
            100% {
                opacity: 0;
                transform: rotate(-90deg) scale(0);
            }
        }

        /* 3. Yellow Star Animation (starts at 700ms, 300ms duration) */
        .star-yellow-anim {
            animation: star-yellow-pop var(--total-duration) infinite;
            transform-origin: 0px 0px;
        }

        @keyframes star-yellow-pop {
            0%, 20.59% { /* 0 to 700ms delay */
                opacity: 0;
                transform: rotate(-90deg) scale(0);
                animation-timing-function: var(--overshoot);
            }
            23.53% { /* +100ms alpha */
                opacity: 1;
            }
            29.41% { /* 1000ms: reaches full scale */
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
            80% {
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
            86% {
                opacity: 0;
                transform: rotate(0deg) scale(0.9);
            }
            100% {
                opacity: 0;
                transform: rotate(-90deg) scale(0);
            }
        }
    </style>

