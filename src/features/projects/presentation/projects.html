<div id="projectsPageContainer" class="page-section active">
  <h1>Projects</h1>
  <p class="projects-intro">A selection of my work using Material Design.</p>
  <mnw-expressive-tab-bar id="projectsFilterTabs" aria-label="Project category"></mnw-expressive-tab-bar>
  <div class="projects-list">
    <md-filled-card class="project-entry" data-category="web">
      <div class="project-content">
        <div class="project-info">
          <h2>Profile Website</h2>
          <div class="date-range">2023&nbsp;&ndash;&nbsp;Present</div>
          <p class="project-description">
            This website showcases my profile, projects, and open-source work.
          </p>
          <div class="project-actions">
            <md-outlined-button
              href="https://github.com/MihaiCristianCondrea/profile"
              target="_blank"
            >
              See code
            </md-outlined-button>
          </div>
        </div>
        <div class="project-media">
          <div class="carousel">
            <img
              class="carousel-slide active"
              src="images/placeholder.png"
              alt="Profile Website screenshot"
              loading="lazy"
            />
            <img
              class="carousel-slide"
              src="images/placeholder.png"
              alt="Profile Website screenshot 2"
              loading="lazy"
            />
            <img
              class="carousel-slide"
              src="images/placeholder.png"
              alt="Profile Website screenshot 3"
              loading="lazy"
            />
            <md-icon-button class="prev" aria-label="Previous">
              <md-icon>chevron_left</md-icon>
            </md-icon-button>
            <md-icon-button class="next" aria-label="Next">
              <md-icon>chevron_right</md-icon>
            </md-icon-button>
          </div>
        </div>
      </div>
    </md-filled-card>
    <mnw-app-showcase id="androidProjectsContainer" data-category="android" headline="Android apps" limit="50"></mnw-app-showcase>
  </div>
</div>
