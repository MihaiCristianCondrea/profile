name: Regenerate security lockfile

on:
  push:
    branches:
      - security/dependency-overrides-2026-08

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: security/dependency-overrides-2026-08
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify dependency tree
        run: npm ci && npm ls js-yaml @babel/core
      - name: Run project and security checks
        run: npm run check
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regenerate-security-lock.yml
          git add package-lock.json
          git commit -m "Regenerate lockfile with patched dependencies"
          git push
