name: Fix footer icon alignment

on:
  push:
    branches: [fix/footer-icon-centering]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/footer-icon-centering
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Center footer icons
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/core/styles/components.css')
          source = path.read_text(encoding='utf-8')
          old = """.social-icons md-icon-button {
            --md-icon-button-icon-color: var(--md-sys-color-on-surface-variant);
          }
          """
          new = """.social-icons md-icon-button {
            --md-icon-button-icon-color: var(--md-sys-color-on-surface-variant);
            --md-icon-button-icon-size: 20px;
            vertical-align: middle;
          }

          .social-icons md-icon-button > i,
          .social-icons md-icon-button > md-icon {
            display: inline-grid;
            width: 24px;
            height: 24px;
            margin: 0;
            place-items: center;
            font-size: 20px;
            line-height: 1;
            text-align: center;
          }

          .social-icons md-icon-button > md-icon {
            font-size: 22px;
          }
          """
          if source.count(old) != 1:
              raise RuntimeError('Expected one footer icon-button style block')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify project
        run: |
          grep -F -- '--md-icon-button-icon-size: 20px;' src/core/styles/components.css
          grep -F '.social-icons md-icon-button > i,' src/core/styles/components.css
          npm run check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-footer-icons.yml
          git add src/core/styles/components.css
          git commit -m "Center social icons inside footer buttons"
          git push
