name: Build and deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --runInBand
      - name: Fetch Blogger posts
        env:
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
          # Optional overrides. Set BLOGGER_BLOG_ID to skip the byurl lookup
          # when the blog's public address changes.
          BLOGGER_BLOG_ID: ${{ vars.BLOGGER_BLOG_ID }}
          BLOGGER_BLOG_URL: ${{ vars.BLOGGER_BLOG_URL }}
        run: npm run prepare:blog
      - name: Build site
        run: npm run deploy
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    # Fails loudly if a legacy branch deployment replaced the built site with raw
    # source (unstyled page). See docs/deployment.md "Unstyled live site".
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Wait for competing deployments to settle
        run: sleep 90
      - name: Verify live site serves the production build
        run: node scripts/verify-live-site.mjs "${{ needs.deploy.outputs.page_url }}"
