name: Refine footer shell layout

on:
  push:
    branches:
      - ui/footer-shell-no-dividers

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ui/footer-shell-no-dividers
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Refine spacing and responsive layout
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:80]!r}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'index.html',
              '        </md-filled-card>\n\n      </div>',
              '        </md-filled-card>\n      </div>',
          )

          replace_once(
              'src/core/styles/components.css',
              ".profile-card-actions,\n"
              ".smart-cleaner-hero-actions,\n"
              ".smart-cleaner-github-buttons {\n"
              "  display: flex;\n"
              "  flex-wrap: wrap;\n"
              "  gap: 12px;\n"
              "}\n",
              ".profile-card-actions,\n"
              ".smart-cleaner-hero-actions,\n"
              ".smart-cleaner-github-buttons {\n"
              "  display: flex;\n"
              "  flex-wrap: wrap;\n"
              "  gap: 12px;\n"
              "}\n\n"
              ".profile-card-actions {\n"
              "  margin-top: 28px;\n"
              "}\n",
          )

          replace_once(
              'src/core/styles/components.css',
              "md-filled-card.contribute-card {\n"
              "  --md-filled-card-container-shape: 16px;\n"
              "  margin-bottom: 40px;\n"
              "  padding: 24px;\n"
              "}\n",
              "md-filled-card.contribute-card {\n"
              "  --md-filled-card-container-shape: 16px;\n"
              "  margin-bottom: 0;\n"
              "  padding: 24px;\n"
              "}\n",
          )

          replace_once(
              'src/core/styles/components.css',
              ".app-footer {\n"
              "  padding: 0 max(16px, env(safe-area-inset-right, 0px))\n"
              "    calc(24px + env(safe-area-inset-bottom, 0px))\n"
              "    max(16px, env(safe-area-inset-left, 0px));\n"
              "  color: var(--md-sys-color-on-surface-variant);\n"
              "  font-size: 0.875rem;\n"
              "}\n\n"
              ".footer-shell {\n"
              "  display: flex;\n"
              "  width: min(100%, 900px);\n"
              "  align-items: center;\n"
              "  justify-content: space-between;\n"
              "  gap: 12px 20px;\n"
              "  margin-inline: auto;\n"
              "  border-radius: 24px;\n"
              "  padding: 12px 16px 12px 20px;\n"
              "  background: var(--app-filled-card-container-color);\n"
              "}\n",
              ".app-footer {\n"
              "  width: min(100%, 900px);\n"
              "  margin-inline: auto;\n"
              "  padding: 0 max(16px, calc(16px + var(--safe-area-inset-right)))\n"
              "    calc(24px + var(--safe-area-inset-bottom))\n"
              "    max(16px, calc(16px + var(--safe-area-inset-left)));\n"
              "  color: var(--md-sys-color-on-surface-variant);\n"
              "  font-size: 0.875rem;\n"
              "}\n\n"
              ".footer-shell {\n"
              "  display: flex;\n"
              "  width: 100%;\n"
              "  flex-wrap: wrap;\n"
              "  align-items: center;\n"
              "  justify-content: space-between;\n"
              "  gap: 12px 20px;\n"
              "  border-radius: 24px;\n"
              "  padding: 12px 16px 12px 20px;\n"
              "  background: var(--app-filled-card-container-color);\n"
              "}\n",
          )

          replace_once(
              'src/core/styles/components.css',
              ".social-icons {\n"
              "  display: flex;\n"
              "  flex-wrap: wrap;\n"
              "  align-items: center;\n"
              "  justify-content: flex-end;\n"
              "  gap: 4px;\n"
              "}\n",
              ".social-icons {\n"
              "  display: flex;\n"
              "  flex-wrap: wrap;\n"
              "  align-items: center;\n"
              "  justify-content: flex-end;\n"
              "  gap: 4px;\n"
              "  margin-inline-start: auto;\n"
              "}\n",
          )

          replace_once(
              'src/core/styles/components.css',
              "  .social-icons {\n"
              "    justify-content: center;\n"
              "  }\n",
              "  .social-icons {\n"
              "    justify-content: center;\n"
              "    margin-inline-start: 0;\n"
              "  }\n",
          )
          PY
      - name: Install and verify
        run: |
          npm ci
          npm run check
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-footer-shell.yml
          git add index.html src/core/styles/components.css
          git commit -m "Refine footer shell spacing and wrapping"
          git push
